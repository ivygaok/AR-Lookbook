<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AR Lookbook</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="welcome" class="card">
    <p class="eyebrow">AN INTERACTIVE LOOKBOOK</p>
    <h1>Meet the artist.</h1>
    <p>Start the camera, then point your phone at the flower-shaped portrait.</p>
    <img class="preview" src="assets/target.png" alt="Flower-shaped portrait to scan">
    <button id="start" disabled>Loading AR…</button>
    <p id="message" role="status" aria-live="polite">Preparing the experience…</p>
    <p class="small">Allow camera access when asked. The video starts muted; tap Sound to hear it. Camera images are processed on your device.</p>
  </main>
  <div id="toolbar" hidden>
    <p id="status" role="status" aria-live="polite">Point at the flower portrait</p>
    <div class="buttons">
      <button id="sound" aria-pressed="false">Sound: off</button>
      <button id="play" hidden>Play video</button>
      <button id="stop">Stop camera</button>
    </div>
  </div>
  <video id="art-video" src="assets/video.mp4" muted playsinline loop preload="metadata" crossorigin="anonymous" hidden></video>
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="portrait" mindar-image-target="targetIndex: 0">
      <!-- Width 1 = the flower's bounding width. 0.5625 preserves the video's 16:9 shape. -->
      <a-video src="#art-video" width="1" height="0.5625" position="0 0 0.01"
        material="shader: flat; side: double;"></a-video>
    </a-entity>
  </a-scene>
</body>
</html>
